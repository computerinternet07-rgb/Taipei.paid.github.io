/* =========================================================
   長輩超大字 UI / UX 版本
   直接取代原本整份 <style> 內容
========================================================= */

:root {

  --bg: #02050d;
  --panel: rgba(7,18,39,.94);

  --white: #ffffff;
  --text: #ffffff;
  --text-soft: #e7eefb;
  --text-muted: #c2cde0;

  --cyan: #67e8ff;
  --blue: #7595ff;
  --purple: #ac83ff;
  --pink: #ff82c3;
  --green: #62f0ad;

  --border:
    rgba(255,255,255,.17);

  --radius:
    30px;

  /* 長輩版基準字體 */
  --base-font:
    21px;

}


/* =========================================================
   01. 基本
========================================================= */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {

  margin: 0;

  min-height: 100vh;

  overflow-x: hidden;

  color: var(--text);

  background:
    radial-gradient(
      circle at 50% 10%,
      rgba(80,125,255,.20),
      transparent 36%
    ),
    radial-gradient(
      circle at 15% 80%,
      rgba(150,90,255,.16),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 75%,
      rgba(0,220,255,.12),
      transparent 27%
    ),
    var(--bg);

  font-family:
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    Arial,
    sans-serif;

  font-size:
    var(--base-font);

  line-height:
    1.8;

}


/* =========================================================
   02. 大字按鈕
========================================================= */

button {

  font-family: inherit;

}

button:focus-visible,
a:focus-visible {

  outline:
    4px solid var(--cyan);

  outline-offset:
    4px;

}


/* =========================================================
   03. 星空
========================================================= */

#spaceCanvas {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0;

  pointer-events: none;

}

.space-vignette {

  position: fixed;

  inset: 0;

  z-index: 1;

  pointer-events: none;

  background:
    radial-gradient(
      ellipse at center,
      transparent 18%,
      rgba(0,0,0,.12) 55%,
      rgba(0,0,0,.72) 100%
    );

}

.space-grid {

  position: fixed;

  left: -25%;
  right: -25%;

  bottom: -20%;

  height: 62%;

  opacity: .11;

  z-index: 1;

  pointer-events: none;

  background-image:
    linear-gradient(
      rgba(110,205,255,.24) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(110,205,255,.24) 1px,
      transparent 1px
    );

  background-size:
    76px 76px;

  transform:
    perspective(700px)
    rotateX(69deg);

}


/* =========================================================
   04. 啟動畫面
========================================================= */

#intro {

  position: fixed;

  inset: 0;

  z-index: 99999;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    radial-gradient(
      circle,
      rgba(70,120,255,.24),
      transparent 46%

    #01030a;

  transition:
    opacity .9s ease,
    visibility .9s ease;

}

#intro.hidden {

  opacity: 0;

  visibility: hidden;

}

.intro-core {

}

.intro-title {

.portal-stage {

  position:

  width:

  height:
    600px;

}

.portal-ring {

  position:
    absolute;

  inset:
    10px;

  border-radius:

  border:

  box-shadow:

.portal-platform {

  position:
    absolute;

  bottom:
    22px;

  left:
    50%;

  width:

  height:

  transform:

    perspective(400px)
    rotateX(64deg);

  border-radius:
    50%;

  border:
    2px solid rgba(105,231,255,.26);

}

.portal-door-frame {

  position:
    absolute;

  inset:
    52px 46px 60px;

  transform-style:
    preserve-3d;

}

.portal-door {

  position:
    absolute;

  top:
    0;

  bottom:
    0;

  width:
    50%;

  overflow:
    hidden;

  background:
    linear-gradient(
      145deg,
      rgba(5,13,30,.99),
      rgba(18,37,72,.98)
    );

  border:
    2px solid rgba(150,229,255,.17);

  box-shadow:
    inset 0 0 42px rgba(70,216,255,.07);

  transition:
    transform 1.65s
    cubic-bezier(.16,1,.3,1);

  z-index:
    6;

}

.portal-door.left {

  left:
    0;

  transform-origin:
    left center;

  border-radius:
    155px 14px 14px 14px;

}

.portal-door.right {

  right:
    0;

  transform-origin:
    right center;

  border-radius:
    14px 155px 14px 14px;

}

.portal-door-frame.open
.portal-door.left {

  transform:
    rotateY(-102deg)
    translateZ(25px);

}

.portal-door-frame.open
.portal-door.right {

  transform:

.service-card {

  --accent:
    var(--cyan);

  position:
    relative;

  min-height:
    380px;

  padding:
    32px;

  overflow:
    hidden;

  border:
    2px solid rgba(255,255,255,.13);

  border-radius:
    30px;

      rgba(3,9,23,.98)
    );

  transition:
    transform .40s
    cubic-bezier(.16,1,.3,1),
    border-color .35s ease,
    box-shadow .35s ease;

}

.service-card:hover {

  transform:

  border-color:

      var(--accent) 60%,
      white 10%
    );

  box-shadow:
    0 35px 100px rgba(0,0,0,.52),

      color-mix(
        in srgb,
        var(--accent) 9%,
        transparent
      );

}

.service-card::before {

  content:
    "";

  position:
    absolute;

  left:
    0;

  right:
    0;

  top:
    0;

  height:
    3px;

/* =========================================================
   16. Toast
========================================================= */

#toast {

  position:
    fixed;

  left:
    50%;

  bottom:
    28px;

  z-index:
    120000;

  width:
    min(
      760px,
      calc(100vw - 30px)
    );

  padding:
    18px 22px;

  border:
    2px solid rgba(255,255,255,.14);

  border-radius:
    18px;

  background:
    rgba(4,12,25,.97);

  color:
    white;

  font-size:
    20px;

  font-weight:
    900;

  text-align:
    center;

  transform:
    translate(-50%, 35px);

  opacity:
    0;

  visibility:
    hidden;

  transition:
    .35s ease;

}

#toast.show {

  transform:
    translate(-50%, 0);

  opacity:
    1;

  visibility:
    visible;

}
